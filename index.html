<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ACS+ Leaderboard Demo</title>
    <style>
      :root {
        --bg: #07111f;
        --panel: #0f1b2d;
        --panel-2: #14253f;
        --text: #e7f0ff;
        --muted: #9db0ca;
        --accent: #4dd6c8;
        --accent-2: #8c7cff;
        --border: rgba(255, 255, 255, 0.12);
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, Segoe UI, Roboto, Arial, sans-serif;
        background: radial-gradient(circle at top, #16253f 0%, var(--bg) 60%);
        color: var(--text);
        min-height: 100vh;
      }

      .wrap {
        max-width: 1100px;
        margin: 0 auto;
        padding: 24px;
      }

      .hero {
        background: rgba(15, 27, 45, 0.9);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 24px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
        margin-bottom: 20px;
      }

      .hero h1 {
        margin: 0 0 8px;
        font-size: 2rem;
      }

      .hero p {
        margin: 0;
        color: var(--muted);
        line-height: 1.5;
      }

      .summary {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 16px;
      }

      .pill {
        background: rgba(77, 214, 200, 0.14);
        border: 1px solid rgba(77, 214, 200, 0.3);
        color: var(--text);
        padding: 8px 12px;
        border-radius: 999px;
        font-size: 0.95rem;
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 16px;
        flex-wrap: wrap;
      }

      select {
        background: var(--panel-2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 1rem;
      }

      .agent-card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 16px;
        margin-bottom: 16px;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
      }

      .agent-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 12px;
        margin-bottom: 12px;
      }

      .agent-name {
        font-size: 1.2rem;
        font-weight: 700;
        text-transform: capitalize;
      }

      .agent-meta {
        color: var(--muted);
        font-size: 0.95rem;
      }

      .rows {
        display: grid;
        gap: 10px;
      }

      .row {
        display: grid;
        grid-template-columns: 2.2fr 0.8fr 0.7fr;
        gap: 12px;
        align-items: center;
        background: var(--panel-2);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 12px;
        padding: 12px 14px;
      }

      .player {
        font-weight: 600;
      }

      .player small {
        display: block;
        color: var(--muted);
        margin-top: 4px;
        font-weight: 400;
      }

      .metric {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      .metric-label {
        color: var(--muted);
        font-size: 0.8rem;
        display: block;
        margin-bottom: 4px;
      }

      .loading, .error {
        padding: 16px;
        border-radius: 12px;
        background: var(--panel);
        border: 1px solid var(--border);
      }

      .error { color: #ff8d8d; }

      @media (max-width: 720px) {
        .row { grid-template-columns: 1fr; }
        .metric { text-align: left; }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <section class="hero">
        <h1>ACS+ leaderboard demo</h1>
        <p>VCT highest ACS+ scores (ex CN), sorted from highest to lowest.</p>
        <div class="summary" id="summary"></div>
      </section>
      <section id="content">
        <div class="loading">Loading leaderboard…</div>
      </section>
    </main>

    <script>
      let playerEntries = [];

      function parseResultEntry(entry) {
        if (typeof entry === 'string') {
          const match = entry.match(/^(.*?)\s*:\s*([0-9.+-]+)$/);
          if (!match) return null;

          const raw = match[1].trim();
          const fullName = raw;
          const name = raw;

          return {
            name,
            fullName,
            acs: Number(match[2]),
          };
        }

        if (entry && typeof entry === 'object') {
          const rawName = entry.Player || entry.player || entry.name || entry['Player-Agent'] || entry['player-agent'] || 'Unknown';
          const name = String(rawName).trim();

          const rawRating = entry.Rating ?? entry.rating ?? entry['rating'] ?? null;
          const rating = rawRating === null || rawRating === '' ? null : Number(rawRating);

          return {
            name,
            fullName: name,
            acs: Number(entry['ACS+'] ?? entry.ACS ?? entry.acs ?? entry.score ?? entry.value ?? 0),
            rating: Number.isFinite(rating) ? rating : null,
          };
        }

        return null;
      }

      function renderLeaderboard() {
        const content = document.getElementById('content');
        const summary = document.getElementById('summary');

        if (!playerEntries.length) {
          content.innerHTML = '<div class="error">No ACS+ data available for this leaderboard.</div>';
          return;
        }

        summary.innerHTML = `
          <div class="pill">Players: ${playerEntries.length}</div>
          <div class="pill">Top ACS+: ${playerEntries[0].acs}</div>
        `;

        content.innerHTML = `
          <article class="agent-card">
            <div class="agent-header">
              <div class="agent-name">Players</div>
              <div class="agent-meta">One ACS+ score per player</div>
            </div>
            <div class="rows">
              ${playerEntries.map((player) => `
                <div class="row">
                  <div class="player">${player.name}<small>${player.rating != null ? `Rating: ${player.rating}` : 'Rating unavailable'}</small></div>
                  <div class="metric">
                    <span class="metric-label">ACS+</span>
                    ${player.acs}
                  </div>
                  <div class="metric">
                    <span class="metric-label">Rank</span>
                    #${player.rank}
                  </div>
                </div>
              `).join('')}
            </div>
          </article>
        `;
      }

      async function loadData() {
        try {
          const response = await fetch('results.json');
          if (!response.ok) throw new Error('Unable to load data file');
          const rows = await response.json();

          const byPlayer = new Map();
          rows.forEach((rawRow) => {
            const parsed = parseResultEntry(rawRow);
            if (!parsed) return;

            const key = parsed.name.toLowerCase();
            const current = byPlayer.get(key);
            if (!current || parsed.acs > current.acs) {
              byPlayer.set(key, {
                name: parsed.name,
                fullName: parsed.fullName,
                acs: parsed.acs,
                rating: parsed.rating,
              });
            }
          });

          playerEntries = Array.from(byPlayer.values())
            .sort((a, b) => b.acs - a.acs)
            .map((player, index) => ({ ...player, rank: index + 1 }));

          if (!playerEntries.length) {
            throw new Error('No ACS+ leaderboard data found in results.json');
          }

          renderLeaderboard();
        } catch (err) {
          document.getElementById('content').innerHTML = `<div class="error">${err.message}</div>`;
        }
      }

      loadData();
    </script>
  </body>
</html>
