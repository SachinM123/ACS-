<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ACS+ Leaderboard Demo</title>
    <style>
      :root {
        --bg: #07111f;
        --panel: #0f1b2d;
        --panel-2: #14253f;
        --text: #e7f0ff;
        --muted: #9db0ca;
        --accent: #4dd6c8;
        --accent-2: #8c7cff;
        --border: rgba(255, 255, 255, 0.12);
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, Segoe UI, Roboto, Arial, sans-serif;
        background: radial-gradient(circle at top, #16253f 0%, var(--bg) 60%);
        color: var(--text);
        min-height: 100vh;
      }

      .wrap {
        max-width: 1100px;
        margin: 0 auto;
        padding: 24px;
      }

      .hero {
        background: rgba(15, 27, 45, 0.9);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 24px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
        margin-bottom: 20px;
      }

      .hero h1 {
        margin: 0 0 8px;
        font-size: 2rem;
      }

      .hero p {
        margin: 0;
        color: var(--muted);
        line-height: 1.5;
      }

      .summary {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 16px;
      }

      .pill {
        background: rgba(77, 214, 200, 0.14);
        border: 1px solid rgba(77, 214, 200, 0.3);
        color: var(--text);
        padding: 8px 12px;
        border-radius: 999px;
        font-size: 0.95rem;
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 16px;
        flex-wrap: wrap;
      }

      select {
        background: var(--panel-2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 1rem;
      }

      .agent-card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 16px;
        margin-bottom: 16px;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
      }

      .agent-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 12px;
        margin-bottom: 12px;
      }

      .agent-name {
        font-size: 1.2rem;
        font-weight: 700;
        text-transform: capitalize;
      }

      .agent-meta {
        color: var(--muted);
        font-size: 0.95rem;
      }

      .rows {
        display: grid;
        gap: 10px;
      }

      .row {
        display: grid;
        grid-template-columns: 2.2fr 0.8fr 0.7fr;
        gap: 12px;
        align-items: center;
        background: var(--panel-2);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 12px;
        padding: 12px 14px;
      }

      .player {
        font-weight: 600;
      }

      .player small {
        display: block;
        color: var(--muted);
        margin-top: 4px;
        font-weight: 400;
      }

      .metric {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      .metric-label {
        color: var(--muted);
        font-size: 0.8rem;
        display: block;
        margin-bottom: 4px;
      }

      .loading, .error {
        padding: 16px;
        border-radius: 12px;
        background: var(--panel);
        border: 1px solid var(--border);
      }

      .error { color: #ff8d8d; }

      @media (max-width: 720px) {
        .row { grid-template-columns: 1fr; }
        .metric { text-align: left; }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <section class="hero">
        <h1>ACS+ leaderboard demo</h1>
        <p>Choose an agent from the dropdown to view that agent’s players sorted from highest ACS down to lowest.</p>
        <div class="controls">
          <label for="agentSelect">Agent</label>
          <select id="agentSelect"></select>
        </div>
        <div class="summary" id="summary"></div>
      </section>
      <section id="content">
        <div class="loading">Loading leaderboard…</div>
      </section>
    </main>

    <script>
      let agentEntries = [];

      function renderAgent(agentName) {
        const content = document.getElementById('content');
        const summary = document.getElementById('summary');
        const selected = agentEntries.find((entry) => entry.agent === agentName);

        if (!selected) {
          content.innerHTML = '<div class="error">No data available for this agent.</div>';
          return;
        }

        summary.innerHTML = `
          <div class="pill">Agent: ${selected.agent}</div>
          <div class="pill">Players: ${selected.count}</div>
          <div class="pill">Top ACS: ${selected.topAcs}</div>
        `;

        content.innerHTML = `
          <article class="agent-card">
            <div class="agent-header">
              <div class="agent-name">${selected.agent}</div>
              <div class="agent-meta">Sorted by ACS descending</div>
            </div>
            <div class="rows">
              ${selected.players.map((player) => `
                <div class="row">
                  <div class="player">${player.name}<small>${player.fullName}</small></div>
                  <div class="metric">
                    <span class="metric-label">ACS</span>
                    ${player.acs}
                  </div>
                  <div class="metric">
                    <span class="metric-label">Rounds</span>
                    ${player.rounds}
                  </div>
                </div>
              `).join('')}
            </div>
          </article>
        `;
      }

      async function loadData() {
        const select = document.getElementById('agentSelect');

        try {
          const response = await fetch('./scraper/data/output.json');
          if (!response.ok) throw new Error('Unable to load data file');
          const rows = await response.json();

          const grouped = rows.reduce((acc, row) => {
            const agent = (row.Agents || row.Agent || 'unknown').toLowerCase();
            if (!acc[agent]) acc[agent] = [];
            acc[agent].push({
              name: (row['Player-Agent'] || '').split('-')[0],
              fullName: row['Player-Agent'] || 'Unknown',
              rounds: Number(row.Rounds || 0),
              acs: Number(row.ACS || 0),
            });
            return acc;
          }, {});

          agentEntries = Object.entries(grouped)
            .map(([agent, players]) => {
              const sortedPlayers = [...players].sort((a, b) => b.acs - a.acs);
              return {
                agent,
                players: sortedPlayers,
                topAcs: sortedPlayers[0]?.acs || 0,
                count: sortedPlayers.length,
              };
            })
            .sort((a, b) => b.topAcs - a.topAcs);

          select.innerHTML = agentEntries.map((entry) => `
            <option value="${entry.agent}">${entry.agent}</option>
          `).join('');

          select.addEventListener('change', (event) => renderAgent(event.target.value));
          renderAgent(agentEntries[0]?.agent || '');
        } catch (err) {
          document.getElementById('content').innerHTML = `<div class="error">${err.message}</div>`;
        }
      }

      loadData();
    </script>
  </body>
</html>
